<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TesiT — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0F0F0F;
      --bg-nav:    #111111;
      --surface:   #1C1C1E;
      --surface-2: #242426;
      --accent:    #7c1fff;
      --accent-dim:#4a0f99;
      --text:      #FFFFFF;
      --text-body: #AAAAAA;
      --text-muted:#888888;
      --border:    #2a2a2a;
      --radius-card: 12px;
      --radius-pill: 999px;
      --font-sans: 'IBM Plex Sans', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
      --nav-h:     56px;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      height: var(--nav-h);
      background: var(--bg-nav);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      flex-shrink: 0;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-logo {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--text);
      text-decoration: none;
    }

    .nav-logo span { color: var(--accent); }

    .nav-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: var(--radius-pill);
    }

    .btn-new {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: var(--text);
      border: none;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: background 0.15s;
      letter-spacing: 0.01em;
    }

    .btn-new:hover { background: var(--accent-dim); }

    .btn-new svg { flex-shrink: 0; }

    /* ── LAYOUT ── */
    .app {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 300px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 20px 20px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-title {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .exp-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .exp-list::-webkit-scrollbar { width: 4px; }
    .exp-list::-webkit-scrollbar-track { background: transparent; }
    .exp-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .exp-item {
      padding: 14px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.1s;
      border: 1px solid transparent;
      margin-bottom: 2px;
    }

    .exp-item:hover { background: var(--surface); }

    .exp-item.active {
      background: var(--surface);
      border-color: var(--accent);
    }

    .exp-item-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .exp-item-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3ddc84;
      flex-shrink: 0;
    }

    .status-dot.inactive { background: var(--text-muted); }

    .exp-item-variants {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    .empty-list {
      padding: 40px 20px;
      text-align: center;
    }

    .empty-list p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.7;
    }

    .empty-list strong {
      color: var(--text-body);
      font-weight: 500;
    }

    /* ── MAIN PANEL ── */
    .main {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .main::-webkit-scrollbar { width: 4px; }
    .main::-webkit-scrollbar-track { background: transparent; }
    .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
    }

    .placeholder-icon {
      width: 40px;
      height: 40px;
      opacity: 0.3;
    }

    .placeholder p {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ── RESULTS PANEL ── */
    .results-panel {
      padding: 36px 40px;
      display: none;
    }

    .results-panel.visible { display: block; }

    .results-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 36px;
      gap: 16px;
    }

    .results-name {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 6px;
    }

    .results-id {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #3ddc84;
    }

    .status-pill.inactive {
      color: var(--text-muted);
    }

    /* stats row */
    .stats-row {
      display: flex;
      gap: 2px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--surface);
      padding: 20px 24px;
      flex: 1;
    }

    .stat-card:first-child { border-radius: var(--radius-card) 0 0 var(--radius-card); }
    .stat-card:last-child  { border-radius: 0 var(--radius-card) var(--radius-card) 0; }

    .stat-card-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .stat-card-val {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 500;
      color: var(--text);
    }

    /* variant results */
    .variants-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .variant-rows {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .variant-row {
      background: var(--surface);
      padding: 20px 24px;
      border-radius: 0;
      display: grid;
      grid-template-columns: 120px 1fr 80px 80px 100px;
      align-items: center;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }

    .variant-row:first-child { border-radius: var(--radius-card) var(--radius-card) 0 0; }
    .variant-row:last-child  { border-radius: 0 0 var(--radius-card) var(--radius-card); }
    .variant-row:only-child  { border-radius: var(--radius-card); }

    .variant-row.winner::before {
      content: '';
      position: absolute;
      left: 0; top: 0;
      width: 3px; height: 100%;
      background: var(--accent);
    }

    .variant-name {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .variant-bar-track {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .variant-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--accent);
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .variant-bar-fill.dim { opacity: 0.35; }

    .variant-stat {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-body);
      text-align: right;
    }

    .variant-stat span {
      display: block;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    .variant-rate {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
      text-align: right;
    }

    .winner-badge {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 4px;
  }

    /* loading / error */
    .panel-loading,
    .panel-error {
      padding: 60px 40px;
      text-align: center;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 13px;
    }

    .panel-error { color: #ff6b6b; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      width: 100%;
      max-width: 480px;
      padding: 32px;
      transform: translateY(8px);
      transition: transform 0.15s;
    }

    .modal-overlay.open .modal { transform: translateY(0); }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: color 0.1s;
    }

    .modal-close:hover { color: var(--text); }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: var(--text-muted); }

    .field-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .variants-input {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .variant-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .variant-input-row input { flex: 1; }

    .btn-remove-variant {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.1s;
      flex-shrink: 0;
    }

    .btn-remove-variant:hover { color: #ff6b6b; }

    .btn-add-variant {
      background: none;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      width: 100%;
      margin-top: 4px;
      text-align: left;
    }

    .btn-add-variant:hover { border-color: var(--accent); color: var(--accent); }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 28px;
    }

    .btn-cancel {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 9px 20px;
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text-body);
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .btn-cancel:hover { border-color: #555; }

    .btn-create {
      background: var(--accent);
      border: none;
      border-radius: var(--radius-pill);
      padding: 9px 22px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-create:hover { background: var(--accent-dim); }
    .btn-create:disabled { opacity: 0.5; cursor: not-allowed; }

    .form-error {
      font-size: 12px;
      color: #ff6b6b;
      margin-top: 12px;
      font-family: var(--font-mono);
      display: none;
    }

    .form-error.visible { display: block; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="nav-left">
      <a href="index.html" class="nav-logo">Tesi<span>T</span></a>
      <span class="nav-tag">dashboard</span>
    </div>
    <button class="btn-new" id="btn-open-modal">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
        <path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      New experiment
    </button>
  </nav>

  <!-- APP -->
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Experiments</div>
      </div>
      <div class="exp-list" id="exp-list">
        <div class="empty-list">
          <p>No experiments yet.<br><strong>Create one to get started.</strong></p>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main" id="main-panel">

      <div class="placeholder" id="placeholder">
        <svg class="placeholder-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="32" height="32" rx="6" stroke="currentColor" stroke-width="1.5"/>
          <path d="M13 20h14M20 13v14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <p>Select an experiment to view results</p>
      </div>

      <div class="results-panel" id="results-panel"></div>

    </main>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">New experiment</span>
        <button class="modal-close" id="btn-close-modal">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="field">
        <label for="exp-name">Experiment name</label>
        <input type="text" id="exp-name" placeholder="e.g. button color test">
      </div>

      <div class="field">
        <label>Variants</label>
        <div class="variants-input" id="variants-input">
          <div class="variant-input-row">
            <input type="text" placeholder="e.g. control" data-variant>
          </div>
          <div class="variant-input-row">
            <input type="text" placeholder="e.g. treatment" data-variant>
          </div>
        </div>
        <button class="btn-add-variant" id="btn-add-variant">+ add variant</button>
        <div class="field-hint">Minimum 2 variants required.</div>
      </div>

      <div class="form-error" id="form-error"></div>

      <div class="modal-footer">
        <button class="btn-cancel" id="btn-cancel">Cancel</button>
        <button class="btn-create" id="btn-create">Create experiment</button>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://127.0.0.1:5000';

    //  STATE 
    let experiments = [];
    let activeId = null;

    // ELEMENTS 
    const expList       = document.getElementById('exp-list');
    const mainPanel     = document.getElementById('main-panel');
    const placeholder   = document.getElementById('placeholder');
    const resultsPanel  = document.getElementById('results-panel');
    const modalOverlay  = document.getElementById('modal-overlay');
    const btnOpenModal  = document.getElementById('btn-open-modal');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const btnCancel     = document.getElementById('btn-cancel');
    const btnCreate     = document.getElementById('btn-create');
    const btnAddVariant = document.getElementById('btn-add-variant');
    const variantsInput = document.getElementById('variants-input');
    const expNameInput  = document.getElementById('exp-name');
    const formError     = document.getElementById('form-error');

    // LOAD EXPERIMENTS 
    async function loadExperiments() {
      try {
        const res = await fetch(`${API}/experiments`);
        const data = await res.json();
        experiments = data;
        renderList();
      } catch (e) {
        expList.innerHTML = `<div class="empty-list"><p style="color:#ff6b6b">Could not reach the API.<br>Is Flask running?</p></div>`;
      }
    }

    // RENDER LIST 
    function renderList() {
      if (experiments.length === 0) {
        expList.innerHTML = `<div class="empty-list"><p>No experiments yet.<br><strong>Create one to get started.</strong></p></div>`;
        return;
      }

      expList.innerHTML = experiments.map(exp => `
        <div class="exp-item ${exp.id === activeId ? 'active' : ''}" data-id="${exp.id}">
          <div class="exp-item-name">${exp.name}</div>
          <div class="exp-item-meta">
            <div class="status-dot ${exp.status !== 'active' ? 'inactive' : ''}"></div>
            <span class="exp-item-variants">${exp.variants.join(' / ')}</span>
          </div>
        </div>
      `).join('');

      expList.querySelectorAll('.exp-item').forEach(el => {
        el.addEventListener('click', () => selectExperiment(el.dataset.id));
      });
    }

    //  SELECT EXPERIMENT 
    let refreshInterval = null;

    async function selectExperiment(id) {
      activeId = id;
      renderList();

      placeholder.style.display = 'none';
      resultsPanel.classList.remove('visible');
      resultsPanel.innerHTML = `<div class="panel-loading">loading results...</div>`;
      resultsPanel.classList.add('visible');

      if (refreshInterval) {
        clearInterval(refreshInterval);
        refreshInterval = null;
      }

      await fetchResults(id);

      const exp = experiments.find(e => e.id === id);
      if (exp && exp.status === 'active') {
        refreshInterval = setInterval(() => fetchResults(id), 30000);
      }
    }

    async function fetchResults(id) {
      try {
        const res = await fetch(`${API}/experiments/${id}/results`);
        const data = await res.json();
        renderResults(data);
      } catch (e) {
        resultsPanel.innerHTML = `<div class="panel-error">Failed to load results. Check the API.</div>`;
      }
    }

    //  RENDER RESULTS 
    function renderResults(data) {
      const totalAssigned  = data.results.reduce((s, v) => s + v.assigned, 0);
      const totalConverted = data.results.reduce((s, v) => s + v.converted, 0);
      const overallRate    = totalAssigned > 0 ? ((totalConverted / totalAssigned) * 100).toFixed(1) : '0.0';

      const winner = data.results.reduce((a, b) => a.conversion_rate > b.conversion_rate ? a : b, data.results[0]);
      const maxRate = Math.max(...data.results.map(v => v.conversion_rate), 1);

      resultsPanel.innerHTML = `
        <div class="results-top">
          <div>
            <div class="results-name">${data.name}</div>
            <div class="results-id">${data.experiment_id}</div>
          </div>
          <div class="status-pill ${data.status !== 'active' ? 'inactive' : ''}">
            <div class="status-dot ${data.status !== 'active' ? 'inactive' : ''}"></div>
            ${data.status}
          </div>
        </div>

        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-card-label">Total assigned</div>
            <div class="stat-card-val">${totalAssigned}</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-label">Total conversions</div>
            <div class="stat-card-val">${totalConverted}</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-label">Overall rate</div>
            <div class="stat-card-val">${overallRate}%</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-label">Variants</div>
            <div class="stat-card-val">${data.results.length}</div>
          </div>
        </div>

        <div class="variants-label">Results by variant</div>
        <div class="variant-rows">
          ${data.results.map(v => {
            const isWinner = v.variant === winner.variant && v.conversion_rate > 0;
            const barWidth = maxRate > 0 ? (v.conversion_rate / maxRate * 100) : 0;
            return `
              <div class="variant-row ${isWinner ? 'winner' : ''}">
                <div class="variant-name">${v.variant}</div>
                <div class="variant-bar-track">
                  <div class="variant-bar-fill ${!isWinner ? 'dim' : ''}" style="width: ${barWidth}%"></div>
                </div>
                <div class="variant-stat">${v.assigned}<span>assigned</span></div>
                <div class="variant-stat">${v.converted}<span>converted</span></div>
                <div class="variant-rate">
                  ${v.conversion_rate}%
                  ${isWinner ? '<div class="winner-badge">winning</div>' : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    //  MODAL 
    function openModal() {
      modalOverlay.classList.add('open');
      expNameInput.focus();
    }

    function closeModal() {
      modalOverlay.classList.remove('open');
      resetForm();
    }

    function resetForm() {
      expNameInput.value = '';
      formError.classList.remove('visible');
      variantsInput.innerHTML = `
        <div class="variant-input-row">
          <input type="text" placeholder="e.g. control" data-variant>
        </div>
        <div class="variant-input-row">
          <input type="text" placeholder="e.g. treatment" data-variant>
        </div>
      `;
      btnCreate.disabled = false;
      btnCreate.textContent = 'Create experiment';
    }

    btnOpenModal.addEventListener('click', openModal);
    btnCloseModal.addEventListener('click', closeModal);
    btnCancel.addEventListener('click', closeModal);

    modalOverlay.addEventListener('click', e => {
      if (e.target === modalOverlay) closeModal();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    // ADD VARIANT ROW 
    btnAddVariant.addEventListener('click', () => {
      const row = document.createElement('div');
      row.className = 'variant-input-row';
      row.innerHTML = `
        <input type="text" placeholder="variant name" data-variant>
        <button class="btn-remove-variant" title="Remove">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      `;
      row.querySelector('.btn-remove-variant').addEventListener('click', () => row.remove());
      variantsInput.appendChild(row);
      row.querySelector('input').focus();
    });

    // CREATE EXPERIMENT 
    btnCreate.addEventListener('click', async () => {
      const name = expNameInput.value.trim();
      const variantInputs = variantsInput.querySelectorAll('[data-variant]');
      const variants = Array.from(variantInputs).map(i => i.value.trim()).filter(Boolean);

      if (!name) {
        showFormError('Experiment name is required.');
        return;
      }

      if (variants.length < 2) {
        showFormError('Add at least 2 variants.');
        return;
      }

      btnCreate.disabled = true;
      btnCreate.textContent = 'Creating...';

      try {
        const res = await fetch(`${API}/experiments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, variants })
        });

        const data = await res.json();

        if (!res.ok) {
          showFormError(data.error || 'Something went wrong.');
          btnCreate.disabled = false;
          btnCreate.textContent = 'Create experiment';
          return;
        }

        experiments.unshift(data);
        renderList();
        closeModal();
        selectExperiment(data.id);

      } catch (e) {
        showFormError('Could not reach the API. Is Flask running?');
        btnCreate.disabled = false;
        btnCreate.textContent = 'Create experiment';
      }
    });

    function showFormError(msg) {
      formError.textContent = msg;
      formError.classList.add('visible');
    }

    // INIT 
    loadExperiments();
  </script>

</body>
</html>
